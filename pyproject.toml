[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-bot"
version = "0.2.0"
description = "A project converted from Pipfile to pyproject.toml"
authors = [
    { name = "iarspider", email = "iarspider@gmail.com" }
]

requires-python = ">=3.12"
dependencies = [
    "py-cord[speed]",
    "d20",
    "loguru",
    "pytils",
    "aio-pika",
    "emoji",
    "python-dotenv",
    "python-telegram-bot",
    "babel",
    "pytz"
]
